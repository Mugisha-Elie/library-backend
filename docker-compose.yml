services:
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-library_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-library_secret}
      POSTGRES_DB: ${DATABASE_NAME:-library_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-library_user} -d ${DATABASE_NAME:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: